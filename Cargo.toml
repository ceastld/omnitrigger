[workspace]
members = ["crates/omnitrigger-core", "crates/omnitrigger-windows", "crates/omnitrigger-actions", "crates/omnitrigger-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ceastld/omnitrigger"
readme = "README.md"
publish = false

[profile.dev]
debug = "line-tables-only"

# 依赖（GPUI、布局与路径细分）未优化时，轮盘预览等重绘页面在 dev 构建中滚动明显掉帧。
[profile.dev.package."*"]
debug = false
opt-level = 2
