[workspace]
members = ["crates/omnitrigger-core", "crates/omnitrigger-windows", "crates/omnitrigger-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ceastld/omnitrigger"
readme = "README.md"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
