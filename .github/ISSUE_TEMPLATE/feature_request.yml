name: 功能建议
description: 描述希望解决的使用问题。
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 当前希望完成什么操作，遇到了什么限制？请勿包含敏感配置或真实输入内容。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述希望增加或改变的行为，可附简短示例。
    validations:
      required: true
