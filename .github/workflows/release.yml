name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  build:
    name: 检查并打包 Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --component rust-docs --target x86_64-pc-windows-msvc

      - name: 核对版本与标签
        id: version
        run: |
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法读取 Cargo 版本。' }
          $app = @($metadata.packages | Where-Object name -eq 'omnitrigger-app')
          if ($app.Count -ne 1) { throw '未找到唯一的应用包。' }
          $version = [string]$app[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "应用版本格式无效：$version"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与应用版本 v$version 不一致。"
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '无法读取构建提交。' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: 格式、测试、Clippy 与示例配置检查
        run: ./scripts/check.ps1

      - name: 构建发行包并收集第三方许可
        run: ./scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc

      - name: 验证安装、卸载和重装保留配置
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = (Get-Item "dist/OmniTrigger-$env:RELEASE_VERSION-windows-x86_64-setup.exe").FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs/OmniTrigger'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'OmniTrigger'
          if (Test-Path $app) { throw '测试需要未安装的用户目录。' }
          $data = Join-Path $env:RUNNER_TEMP 'omnitrigger-reinstall-data'
          $env:OMNITRIGGER_HOME = $data
          $null = New-Item -ItemType Directory -Path $data
          $bindings = Join-Path $data 'bindings.json'
          Copy-Item examples/capslock-navigation.json $bindings
          $hash = (Get-FileHash $bindings).Hash
          $shell = New-Object -ComObject WScript.Shell
          foreach ($round in 1..2) {
            $result = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -PassThru -Wait
            if ($result.ExitCode) { throw "安装失败：$($result.ExitCode)" }
            $exe = Join-Path $app 'omnitrigger.exe'
            foreach ($name in @('OmniTrigger','OmniTrigger 测试')) {
              $shortcut = $shell.CreateShortcut((Join-Path $menu "$name.lnk"))
              $arguments = if ($name -eq 'OmniTrigger') { '' } else { '--test-workspace' }
              if ($shortcut.TargetPath -ine $exe -or $shortcut.Arguments -cne $arguments) { throw "快捷方式错误：$name" }
            }
            & $exe --test-workspace --check-config | Out-Host
            if ($LASTEXITCODE) { throw '测试配置档启动失败。' }
            $entry = @((Get-Content (Join-Path $data 'profiles.json') -Raw | ConvertFrom-Json).profiles | Where-Object alias -eq 'testing')
            if ($entry.Count -ne 1 -or $entry[0].kind -ne 'test') { throw '测试配置档登记错误。' }
            $testConfig = Join-Path $data "profiles/$($entry[0].id)/bindings.json"
            if ($round -eq 1) {
              Copy-Item examples/literal-text.json $testConfig -Force
              $testHash = (Get-FileHash $testConfig).Hash
            }
            if ((Get-FileHash $testConfig).Hash -ne $testHash) { throw '测试配置未保留。' }
            $result = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -PassThru -Wait
            if ($result.ExitCode -or (Test-Path $exe) -or (Get-FileHash $bindings).Hash -ne $hash -or (Get-FileHash $testConfig).Hash -ne $testHash) {
              throw '卸载或配置保留验证失败。'
            }
          }

      - name: 准备对应版本的发布说明
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = Join-Path 'docs/releases' "v$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "缺少本版本的发布说明：$notes"
          }
          Copy-Item -LiteralPath $notes -Destination 'dist/RELEASE_NOTES.md'

      - name: 保存 Windows 发行产物
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/OmniTrigger-${{ steps.version.outputs.version }}-windows-x86_64.zip
            dist/OmniTrigger-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: 发布 Windows 预览版
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 写权限作业不检出或执行仓库代码，只处理上一个只读作业的固定产物。
      - name: 下载已验证的发行产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist

      - name: 校验并发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          if ($tag -cne $env:GITHUB_REF_NAME) { throw '发布标签与构建版本不一致。' }
          $archiveName = "OmniTrigger-$env:RELEASE_VERSION-windows-x86_64.zip"
          $archive = Join-Path 'dist' $archiveName
          $setupName = "OmniTrigger-$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          $setup = Join-Path 'dist' $setupName
          $checksums = Join-Path 'dist' 'SHA256SUMS.txt'
          $releaseNotes = Join-Path 'dist' 'RELEASE_NOTES.md'
          $files = @(Get-ChildItem -LiteralPath dist -Force)
          if ($files.Count -ne 4 -or @($files | Where-Object PSIsContainer).Count -ne 0 -or
              -not (Test-Path -LiteralPath $setup -PathType Leaf) -or
              -not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $checksums -PathType Leaf) -or
              -not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw '发行产物必须包含安装器、ZIP、SHA256SUMS.txt 和发布说明。'
          }
          $lines = @(Get-Content -LiteralPath $checksums | Where-Object { $_.Trim() })
          if ($lines.Count -ne 2) { throw 'SHA256SUMS.txt 应列出两项。' }
          foreach ($path in @($archive, $setup)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($lines -cnotcontains "$hash  $([IO.Path]::GetFileName($path))") {
              throw "SHA-256 校验失败：$path"
            }
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repositoryApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $escapedTag = [Uri]::EscapeDataString($tag)
          $reference = Invoke-RestMethod -Uri "$repositoryApi/git/ref/tags/$escapedTag" -Headers $headers
          $object = $reference.object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 8; $depth++) {
            $object = (Invoke-RestMethod -Uri "$repositoryApi/git/tags/$($object.sha)" -Headers $headers).object
          }
          if ($object.type -ne 'commit' -or $object.sha -cne $env:RELEASE_COMMIT) {
            throw '远端标签已变化，拒绝发布与标签不符的构建。'
          }

          # 按标签获取的 REST 端点只返回已发布版本；列表端点也能看到有权访问的草稿。
          # 请求失败直接中止，不能将网络或权限错误当作“尚无 Release”。
          for ($page = 1; ; $page++) {
            $releasePage = Invoke-RestMethod -Uri "$repositoryApi/releases?per_page=100&page=$page" -Headers $headers
            $releases = @($releasePage)
            if (@($releases | Where-Object tag_name -CEQ $tag).Count -ne 0) {
              throw "标签 $tag 已有 Release（可能为草稿），不会覆盖。"
            }
            if ($releases.Count -lt 100) { break }
          }

          $notes = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $releaseNotes))
          $notes += "`n`n源码提交：$env:RELEASE_COMMIT`n构建记录：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'omnitrigger-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release create $tag $archive $setup $checksums --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --latest=false --title "OmniTrigger $tag · Windows 预览版" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw '创建草稿或上传资产失败；保留已有草稿供检查。' }

          # gh 会通过 GraphQL 定位尚未发布的标签，再读取真实 Release；REST tags 端点不支持草稿。
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw '无法读取刚创建的草稿，停止公开。' }
          $release = $releaseJson | ConvertFrom-Json
          $assets = @($release.assets)
          if (-not $release.isDraft -or -not $release.isPrerelease -or $assets.Count -ne 3) {
            throw '草稿状态或发行资产数量异常，停止公开。'
          }
          foreach ($path in @($archive, $setup, $checksums)) {
            $file = Get-Item -LiteralPath $path
            $asset = @($assets | Where-Object name -CEQ $file.Name)
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne $file.Length) {
              throw "远端资产核验失败：$($file.Name)"
            }
            if ($asset[0].digest -ine "sha256:$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)") {
              throw "远端资产摘要不符：$($file.Name)"
            }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw '公开预览版失败；草稿资产保留供检查。' }

  notify-update-api:
    name: 同步统一更新服务
    needs: publish
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/notify-update-api.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      APP_UPDATES_DISPATCH_TOKEN: ${{ secrets.APP_UPDATES_DISPATCH_TOKEN }}
