name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  build:
    name: 检查并打包 Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --component rust-docs --target x86_64-pc-windows-msvc

      - name: 核对版本与标签
        id: version
        run: |
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法读取 Cargo 版本。' }
          $app = @($metadata.packages | Where-Object name -eq 'omnitrigger-app')
          if ($app.Count -ne 1) { throw '未找到唯一的应用包。' }
          $version = [string]$app[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "应用版本格式无效：$version"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与应用版本 v$version 不一致。"
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '无法读取构建提交。' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: 格式、测试、Clippy 与示例配置检查
        run: ./scripts/check.ps1

      - name: 验证独立历史窗口的键盘选择和发送回执
        timeout-minutes: 5
        run: cargo test --locked -p omnitrigger-app --bin omnitrigger clipboard_history_send::tests::popup_keyboard_without_mouse -- --ignored --exact

      - name: 构建发行包并收集第三方许可
        env:
          OMNITRIGGER_BUILD_COMMIT: ${{ steps.version.outputs.commit }}
        run: ./scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc

      - name: 验证安装、卸载和重装保留配置
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = (Get-Item "dist/OmniTrigger-$env:RELEASE_VERSION-windows-x86_64-setup.exe").FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs/OmniTrigger'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'OmniTrigger'
          if (Test-Path $app) { throw '测试需要未安装的用户目录。' }
          # 在独立的 Hosted Runner 上使用安装版的真实默认位置，才能发现误删用户数据的问题。
          $data = Join-Path $env:LOCALAPPDATA 'OmniTrigger'
          if ($env:OMNITRIGGER_HOME -or (Test-Path -LiteralPath $data)) { throw '验收需要全新的默认数据目录。' }
          $null = New-Item -ItemType Directory -Path $data
          $bindings = Join-Path $data 'bindings.json'
          Copy-Item examples/capslock-navigation.json $bindings
          $wheels = Join-Path $data 'wheels.json'
          '{"version":6,"wheels":[{"id":"daily-wheel","name":"日常轮盘","slots":[{"label":"复制","action":{"kind":"send_shortcut","keys":[162,67]}}]}]}' | Set-Content -LiteralPath $wheels -Encoding utf8
          $actions = New-Item -ItemType Directory -Path (Join-Path $data 'actions')
          $historyPackage = 'examples/actions/clipboard-history'
          Copy-Item -LiteralPath $historyPackage -Destination $actions.FullName -Recurse
          Copy-Item -LiteralPath 'examples/actions/n10-rust' -Destination $actions.FullName -Recurse
          $n10Manifest = Join-Path $actions.FullName 'n10-rust/action.json'
          [IO.File]::WriteAllText($n10Manifest, [IO.File]::ReadAllText($n10Manifest), [Text.UTF8Encoding]::new($true))
          $append = Get-Content -LiteralPath "$historyPackage/append-call.json" -Raw | ConvertFrom-Json
          $append.action_id = 'manage'
          $appendFile = Join-Path $env:RUNNER_TEMP 'append-history.json'
          $append | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $appendFile -Encoding utf8BOM
          $expected = @{}
          $dailyHistory = New-Item -ItemType Directory -Path (Join-Path $data 'backups/edits/bindings.json') -Force
          $dailyRevision = Join-Path $dailyHistory.FullName 'edit-0000000000000001.json'
          Copy-Item -LiteralPath 'examples/literal-text.json' -Destination $dailyRevision
          $expected[$dailyRevision] = (Get-FileHash -LiteralPath $dailyRevision).Hash
          foreach ($file in @($bindings, $wheels) + @(Get-ChildItem -LiteralPath $actions.FullName -File -Recurse | ForEach-Object FullName)) {
            $expected[$file] = (Get-FileHash -LiteralPath $file).Hash
          }
          function Assert-ProfileFiles {
            foreach ($file in $expected.Keys) {
              if ((Get-FileHash -LiteralPath $file -ErrorAction Stop).Hash -ne $expected[$file]) { throw "配置已改变：$file" }
            }
          }
          function Assert-HistoryAppend([string[]]$profileArgs, [bool]$shouldInsert) {
            $receipt = & $exe @profileArgs --run-action $appendFile | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $receipt.status -ne 'succeeded' -or
                $receipt.output.inserted -isnot [bool] -or $receipt.output.inserted -ne $shouldInsert) {
              throw "剪贴板历史写入或去重失败（配置参数：$profileArgs，应新增：$shouldInsert）。"
            }
          }
          function Assert-CopiedClipboardRoute([bool]$createCopy) {
            $callFile = Join-Path $env:RUNNER_TEMP 'n10-toggle.json'
            $inputPaths = @{
              cliExecutable = Join-Path $env:RUNNER_TEMP 'absent-cli.exe'
              hostExecutable = Join-Path $env:RUNNER_TEMP 'absent-host.exe'
              dataRoot = Join-Path $env:RUNNER_TEMP 'synthetic-clipboard'
            }
            @{ package_id = 'examples.n10-rust'; action_id = 'toggle'; action_version = 1; input = $inputPaths } |
              ConvertTo-Json | Set-Content -LiteralPath $callFile -Encoding utf8BOM
            $daily = & $exe --check-action $callFile | ConvertFrom-Json
            if ($LASTEXITCODE -or $daily.valid -ne $true -or $daily.handler) { throw '日常档未按外部 N10 动作校验。' }
            if ($createCopy) {
              $created = & $exe --profile-create clipboard-copy --type test --seed copy:default | ConvertFrom-Json
              if ($LASTEXITCODE -or $created.status -ne 'created') { throw '复制日常档失败。' }
              if (Test-Path -LiteralPath (Join-Path $created.directory 'backups/edits')) { throw '测试副本继承了日常档编辑历史。' }
              $copyManifest = Join-Path $created.directory 'actions/n10-rust/action.json'
              $expected[$copyManifest] = $expected[$n10Manifest]
            }
            $savedNode = $env:OMNITRIGGER_NODE
            try {
              $env:OMNITRIGGER_NODE = Join-Path $env:RUNNER_TEMP 'missing-node-for-catalog.exe'
              $snapshot = & $exe --profile clipboard-copy --list-package-actions | ConvertFrom-Json
              if ($LASTEXITCODE) { throw '读取测试档动作目录失败。' }
            } finally {
              $env:OMNITRIGGER_NODE = $savedNode
            }
            $actionsInCopy = @($snapshot.actions | Where-Object { $_.call.package_id -ceq 'examples.n10-rust' })
            $toggle = $actionsInCopy | Where-Object { $_.call.action_id -ceq 'toggle' }
            $verb = $actionsInCopy | Where-Object { $_.call.action_id -ceq '32c12786-9bb8-4b0c-8d55-7e6a4c8a5d10' }
            if ($actionsInCopy.Count -ne 2 -or !$toggle -or $toggle.reference_error -or
                $verb.reference_error.code -cne 'test_clipboard_profile') {
              throw '测试档动作目录应允许无 Node 时打开本档历史，并提示业务指令需要显式测试库。'
            }
            Assert-HistoryAppend @('--profile', 'clipboard-copy') $createCopy
            Assert-HistoryAppend @('--profile', 'clipboard-copy') $false
            $check = & $exe --profile clipboard-copy --check-action $callFile | ConvertFrom-Json
            if ($LASTEXITCODE -or $check.valid -ne $true -or $check.handler -ne 'workspace_text_history') {
              throw '测试档未将三字段 N10 toggle 路由到本档文本历史。'
            }
            $PSNativeCommandUseErrorActionPreference = $false
            $receipt = & $exe --profile clipboard-copy --run-action $callFile 2>&1 | Out-String | ConvertFrom-Json
            if ($LASTEXITCODE -ne 1 -or $receipt.status -ne 'rejected' -or
                $receipt.error.code -ne 'ui_unavailable' -or $receipt.error.effect_state -ne 'not_started') {
              throw "测试档无窗口运行的拒绝回执错误：$($receipt | ConvertTo-Json -Compress)"
            }
          }
          $shell = New-Object -ComObject Shell.Application
          $startup = [Environment]::GetFolderPath('Startup')
          $loginShortcut = Join-Path $startup 'OmniTrigger 托盘.lnk'
          function Install-TestPackage([string]$taskSelection) {
            $flags = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($taskSelection) { $flags += "/MERGETASKS=$taskSelection" }
            $result = Start-Process -FilePath $setup -ArgumentList $flags -WindowStyle Hidden -PassThru -Wait
            if ($result.ExitCode) { throw "安装失败：$($result.ExitCode)" }
          }
          function Assert-LoginShortcut([bool]$selected) {
            if ((Test-Path -LiteralPath $loginShortcut -PathType Leaf) -ne $selected) { throw "登录启动项与安装选择不符：$selected" }
            if ($selected) {
              $link = $shell.Namespace($startup).ParseName('OmniTrigger 托盘.lnk').GetLink
              if ($link.Path -ine $exe -or $link.Arguments -cne '--tray') { throw '登录启动项未指向安装版的日常托盘入口。' }
            }
          }
          foreach ($round in 1..2) {
            Install-TestPackage
            Assert-LoginShortcut $false
            Assert-ProfileFiles
            $exe = Join-Path $app 'omnitrigger.exe'
            foreach ($name in @('OmniTrigger','OmniTrigger 测试')) {
              $shortcut = $shell.Namespace($menu).ParseName("$name.lnk").GetLink
              $arguments = if ($name -eq 'OmniTrigger') { '' } else { '--test-workspace' }
              if ($shortcut.Path -ine $exe -or $shortcut.Arguments -cne $arguments) { throw "快捷方式错误：$name，目标 $($shortcut.Path)，参数 $($shortcut.Arguments)" }
            }
            & $exe --check-config | Out-Host
            if ($LASTEXITCODE) { throw '日常热键或轮盘无效。' }
            Assert-HistoryAppend @() ($round -eq 1)
            Assert-CopiedClipboardRoute ($round -eq 1)
            if ($round -eq 1) {
              $custom = & $exe --profile-create daily-copy --seed copy:default --name '日常配置副本' | ConvertFrom-Json
              if ($LASTEXITCODE -or $custom.status -ne 'created') { throw '安装版创建同名自建档失败。' }
              $other = & $exe --profile-create wheel-lab --seed empty --name '日常配置副本' | ConvertFrom-Json
              if ($LASTEXITCODE -or $other.status -ne 'created' -or $other.id -ceq $custom.id) { throw '第二份同名测试档登记失败。' }
              $origin = Join-Path $data "profiles/$($custom.id).copy-origin.json"
              if ((Get-Content -LiteralPath $origin -Raw | ConvertFrom-Json) -cne 'custom') { throw '同名自建档来源登记有误。' }
              $expected[$origin] = (Get-FileHash -LiteralPath $origin).Hash
              $customHotkeys = Join-Path $custom.directory 'bindings.json'
              Copy-Item -LiteralPath 'examples/application-scopes.json' -Destination $customHotkeys -Force
              $expected[$customHotkeys] = (Get-FileHash -LiteralPath $customHotkeys).Hash
              $restored = & $exe --profile-create restored-edit --seed backup:default:1:current | ConvertFrom-Json
              if ($LASTEXITCODE -or $restored.status -ne 'created') { throw '从已安装版本新建备份副本失败。' }
              $revisionRecord = Join-Path $restored.directory 'backups/restored-revisions.json'
              $expected[$revisionRecord] = (Get-FileHash -LiteralPath $revisionRecord).Hash
              $expected[(Join-Path $restored.directory 'bindings.json')] = $expected[$dailyRevision]
              $expected[(Join-Path $restored.directory 'wheels.json')] = $expected[$wheels]
              $expected[(Join-Path $restored.directory 'actions/n10-rust/action.json')] = $expected[$n10Manifest]
              if (Test-Path -LiteralPath (Join-Path $restored.directory 'clipboard-history.json')) { throw '备份副本继承了日常剪贴板历史。' }
            }
            & $exe --profile restored-edit --check-config | Out-Host
            if ($LASTEXITCODE) { throw '备份副本中的热键和轮盘未通过安装版检查。' }
            Assert-ProfileFiles
            if ($round -eq 1) {
              $edited = Join-Path $restored.directory 'bindings.json'
              Copy-Item -LiteralPath 'examples/application-scopes.json' -Destination $edited -Force
              $expected[$edited] = (Get-FileHash -LiteralPath $edited).Hash
            } else {
              $all = & $exe --profile-list | ConvertFrom-Json
              $customAfter = @($all.profiles | Where-Object { $_.alias -ceq 'daily-copy' })
              if ($LASTEXITCODE -or $customAfter.Count -ne 1 -or $customAfter[0].id -cne $custom.id) { throw '重装后同名自建档的登记身份不符。' }
              $env:OMNITRIGGER_QA_PROFILE_ROOT = $data
              $env:OMNITRIGGER_QA_INSTALLED_EXE = $exe
              $env:OMNITRIGGER_QA_NAMED_ID = $custom.id
              cargo test --locked -p omnitrigger-app --bin omnitrigger profiles::saved_profiles::tests::reopen_installed_profile_from_settings_selection -- --ignored --exact
              if ($LASTEXITCODE) { throw '从设置的测试档列表重新打开安装版窗口失败。' }
              $saved = @($all.profiles | Where-Object { $_.alias -ceq 'restored-edit' -and $_.seed -ceq 'backup:default:1:current' })
              if ($LASTEXITCODE -or $saved.Count -ne 1 -or $saved[0].id -cne $restored.id) { throw '重装后恢复副本的登记身份不符。' }
              & {
                $PSNativeCommandUseErrorActionPreference = $false
                $original = [IO.File]::ReadAllBytes($dailyRevision)
                try {
                  Copy-Item -LiteralPath 'examples/capslock-navigation.json' -Destination $dailyRevision -Force
                  $reply = & $exe --profile-reset $restored.id 2>&1 | Out-String | ConvertFrom-Json
                  if ($LASTEXITCODE -eq 0 -or $reply.status -ne 'rejected' -or $reply.error.message -notlike '*备份内容已变化*') {
                    throw '同号备份更换后，重置未报告内容变化。'
                  }
                } finally {
                  [IO.File]::WriteAllBytes($dailyRevision, $original)
                }
              }
              Assert-ProfileFiles
              $start = [Diagnostics.ProcessStartInfo]::new($exe)
              $start.UseShellExecute = $false
              foreach ($argument in @('--data-root', $data, '--profile', $saved[0].id)) { $start.ArgumentList.Add($argument) }
              $window = [Diagnostics.Process]::Start($start)
              try {
                $title = "OmniTrigger — 测试：$($saved[0].name)"
                $timer = [Diagnostics.Stopwatch]::StartNew()
                while (-not $window.HasExited -and $window.MainWindowTitle -cne $title -and $timer.Elapsed.TotalSeconds -lt 25) {
                  Start-Sleep -Milliseconds 100
                  $window.Refresh()
                }
                if ($window.HasExited -or $window.MainWindowTitle -cne $title) { throw '按登记 ID 未能打开原恢复副本窗口。' }
                if (-not $window.CloseMainWindow() -or -not $window.WaitForExit(20000) -or $window.ExitCode) { throw '恢复副本窗口未正常退出。' }
              } finally {
                if (-not $window.HasExited) { $window.Kill(); $window.WaitForExit(10000) | Out-Null }
                $window.Dispose()
              }
              Assert-ProfileFiles
              Write-Host '已验证重装后按原 ID 打开恢复副本的测试窗口，副本内编辑及日常配置均保留。'
              & ./scripts/check-history-keyboard.ps1 -Executable $exe -Scratch $env:RUNNER_TEMP
            }
            Write-Host "第 $round 轮安装已验证剪贴板扩展可读取带 BOM 的清单与调用，测试副本使用本档历史。"
            & $exe --test-workspace --check-config | Out-Host
            if ($LASTEXITCODE) { throw '测试配置档启动失败。' }
            $entry = @((Get-Content (Join-Path $data 'profiles.json') -Raw | ConvertFrom-Json).profiles | Where-Object alias -eq 'testing')
            if ($entry.Count -ne 1 -or $entry[0].kind -ne 'test') { throw '测试配置档登记错误。' }
            $testDir = Join-Path $data "profiles/$($entry[0].id)"
            $testConfig = Join-Path $testDir 'bindings.json'
            if ($round -eq 1) {
              Copy-Item examples/literal-text.json $testConfig -Force
              $testHistory = New-Item -ItemType Directory -Path (Join-Path $testDir 'backups/edits/wheels.json') -Force
              $testRevision = Join-Path $testHistory.FullName 'edit-0000000000000001.json'
              Copy-Item -LiteralPath $wheels -Destination $testRevision
              $expected[$testRevision] = (Get-FileHash -LiteralPath $testRevision).Hash
              $testActions = New-Item -ItemType Directory -Path (Join-Path $testDir 'actions')
              Copy-Item -LiteralPath $historyPackage -Destination $testActions.FullName -Recurse
            }
            Assert-HistoryAppend @('--test-workspace') ($round -eq 1)
            Install-TestPackage 'logintray'
            Assert-LoginShortcut $true
            if ($round -eq 1) {
              $histories = @((Join-Path $data 'clipboard-history.json'), (Join-Path $testDir 'clipboard-history.json'))
              foreach ($file in $histories) {
                [IO.File]::WriteAllText($file, [IO.File]::ReadAllText($file), [Text.UTF8Encoding]::new($true))
              }
              foreach ($file in @($testConfig, (Join-Path $data 'profiles.json')) + $histories) {
                $expected[$file] = (Get-FileHash -LiteralPath $file).Hash
              }
              ./scripts/check-running-upgrade.ps1 -Setup $setup -Executable $exe -DataRoot $data -Archive "dist/OmniTrigger-$env:RELEASE_VERSION-windows-x86_64.zip" -ExpectedVersion $env:RELEASE_VERSION -LoginShortcut $loginShortcut
              Assert-LoginShortcut $true
              Assert-ProfileFiles
              $catalog = Join-Path $data 'profiles.json'
              Move-Item -LiteralPath $catalog -Destination (Join-Path $env:RUNNER_TEMP 'original-profiles.json')
              Assert-HistoryAppend @('--test-workspace') $false
              Assert-HistoryAppend @('--profile', 'clipboard-copy') $false
              Assert-ProfileFiles
              ./scripts/check-running-uninstall.ps1 -Executable $exe -Archive "dist/OmniTrigger-$env:RELEASE_VERSION-windows-x86_64.zip" -ExpectedVersion $env:RELEASE_VERSION
            } else {
              Install-TestPackage '!logintray'
              Assert-LoginShortcut $false
              Install-TestPackage
              Assert-LoginShortcut $false
              $result = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -PassThru -Wait
              if ($result.ExitCode -or (Test-Path $exe)) { throw '卸载失败。' }
            }
            Assert-LoginShortcut $false
            Assert-ProfileFiles
          }

      - name: 准备对应版本的发布说明
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = Join-Path 'docs/releases' "v$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "缺少本版本的发布说明：$notes"
          }
          Copy-Item -LiteralPath $notes -Destination 'dist/RELEASE_NOTES.md'

      - name: 保存 Windows 发行产物
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/OmniTrigger-${{ steps.version.outputs.version }}-windows-x86_64.zip
            dist/OmniTrigger-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: 发布 Windows 预览版
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 写权限作业不检出或执行仓库代码，只处理上一个只读作业的固定产物。
      - name: 下载已验证的发行产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist

      - name: 校验并发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          if ($tag -cne $env:GITHUB_REF_NAME) { throw '发布标签与构建版本不一致。' }
          $archiveName = "OmniTrigger-$env:RELEASE_VERSION-windows-x86_64.zip"
          $archive = Join-Path 'dist' $archiveName
          $setupName = "OmniTrigger-$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          $setup = Join-Path 'dist' $setupName
          $checksums = Join-Path 'dist' 'SHA256SUMS.txt'
          $releaseNotes = Join-Path 'dist' 'RELEASE_NOTES.md'
          $files = @(Get-ChildItem -LiteralPath dist -Force)
          if ($files.Count -ne 4 -or @($files | Where-Object PSIsContainer).Count -ne 0 -or
              -not (Test-Path -LiteralPath $setup -PathType Leaf) -or
              -not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $checksums -PathType Leaf) -or
              -not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw '发行产物必须包含安装器、ZIP、SHA256SUMS.txt 和发布说明。'
          }
          $lines = @(Get-Content -LiteralPath $checksums | Where-Object { $_.Trim() })
          if ($lines.Count -ne 2) { throw 'SHA256SUMS.txt 应列出两项。' }
          foreach ($path in @($archive, $setup)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($lines -cnotcontains "$hash  $([IO.Path]::GetFileName($path))") {
              throw "SHA-256 校验失败：$path"
            }
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repositoryApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $escapedTag = [Uri]::EscapeDataString($tag)
          $reference = Invoke-RestMethod -Uri "$repositoryApi/git/ref/tags/$escapedTag" -Headers $headers
          $object = $reference.object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 8; $depth++) {
            $object = (Invoke-RestMethod -Uri "$repositoryApi/git/tags/$($object.sha)" -Headers $headers).object
          }
          if ($object.type -ne 'commit' -or $object.sha -cne $env:RELEASE_COMMIT) {
            throw '远端标签已变化，拒绝发布与标签不符的构建。'
          }

          # 按标签获取的 REST 端点只返回已发布版本；列表端点也能看到有权访问的草稿。
          # 请求失败直接中止，不能将网络或权限错误当作“尚无 Release”。
          for ($page = 1; ; $page++) {
            $releasePage = Invoke-RestMethod -Uri "$repositoryApi/releases?per_page=100&page=$page" -Headers $headers
            $releases = @($releasePage)
            if (@($releases | Where-Object tag_name -CEQ $tag).Count -ne 0) {
              throw "标签 $tag 已有 Release（可能为草稿），不会覆盖。"
            }
            if ($releases.Count -lt 100) { break }
          }

          $notes = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $releaseNotes))
          $notes += "`n`n源码提交：$env:RELEASE_COMMIT`n构建记录：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'omnitrigger-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release create $tag $archive $setup $checksums --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --latest=false --title "OmniTrigger $tag · Windows 预览版" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw '创建草稿或上传资产失败；保留已有草稿供检查。' }

          # gh 会通过 GraphQL 定位尚未发布的标签，再读取真实 Release；REST tags 端点不支持草稿。
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw '无法读取刚创建的草稿，停止公开。' }
          $release = $releaseJson | ConvertFrom-Json
          $assets = @($release.assets)
          if (-not $release.isDraft -or -not $release.isPrerelease -or $assets.Count -ne 3) {
            throw '草稿状态或发行资产数量异常，停止公开。'
          }
          foreach ($path in @($archive, $setup, $checksums)) {
            $file = Get-Item -LiteralPath $path
            $asset = @($assets | Where-Object name -CEQ $file.Name)
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne $file.Length) {
              throw "远端资产核验失败：$($file.Name)"
            }
            if ($asset[0].digest -ine "sha256:$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)") {
              throw "远端资产摘要不符：$($file.Name)"
            }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw '公开预览版失败；草稿资产保留供检查。' }

  notify-update-api:
    name: 同步统一更新服务
    needs: publish
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/notify-update-api.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      APP_UPDATES_DISPATCH_TOKEN: ${{ secrets.APP_UPDATES_DISPATCH_TOKEN }}
