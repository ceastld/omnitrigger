name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  windows:
    name: Windows 检查与构建
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 检查、构建并验证示例配置
        shell: pwsh
        run: ./scripts/check.ps1

      - name: 验证独立窗口站中的剪贴板排除格式
        shell: pwsh
        run: |
          cargo test --locked -p omnitrigger-windows --test clipboard_exclusion -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p omnitrigger-app isolated_clipboard_restore_smoke -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 SDK 检查使用的 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/script-sdk-check/package-lock.json

      - name: 验证脚本工程与真实类型检查
        shell: pwsh
        run: |
          Push-Location tools/script-sdk-check
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          node tools/script-sdk-check/check.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-fs-stat.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证常用动作和浏览器工作流
        shell: pwsh
        run: |
          node --test tests/browser_workflows.test.mjs examples/actions/common-desktop/recipes.test.mjs examples/actions/common-search/recipes.test.mjs examples/actions/script-choice/contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/ui_notify_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/fs_stat_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/actions/common-search/open-or-search.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证轻量脚本开发包的真实安装与切换
        shell: pwsh
        run: |
          rustup component add rust-docs --toolchain 1.90.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/js-engine-probe/package-runtime.ps1 -OutputDirectory "$PWD/.tmp/script-runtime-ci"
          node tools/js-engine-probe/check-install.mjs target/debug/omnitrigger.exe .tmp/script-runtime-ci/result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证更新服务发布通知
        run: python -m unittest discover -s scripts -p 'test_update_*.py' -v

      - name: 验证离线动作迁移评估
        run: python -m unittest discover -s scripts -p 'test_*migration.py' -v

  js-engines:
    name: Windows JS 引擎实验
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tools/js-engine-probe
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: 缓存实验构建
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/js-engine-probe -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 格式、真实宿主测试与 Clippy
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($engine in @('boa', 'quickjs')) {
            $engineArguments = @('--release', '--locked', '--no-default-features', '--features', $engine)
            if ($engine -eq 'quickjs') { $engineArguments += @('--target-dir', 'target/quickjs') }
            cargo test @engineArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --all-targets @engineArguments -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 构建两种引擎并测量体积
        run: ./measure.ps1

      - name: 验证轻量引擎接入动作服务
        run: |
          foreach ($engine in @('boa', 'quickjs')) {
            $env:OMNITRIGGER_TEST_SCRIPT_HOST = Join-Path $PWD "results/$engine-small.exe"
            cargo test --manifest-path ../../Cargo.toml --locked -p omnitrigger-actions --tests -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 保存测量数据
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-engine-measurements
          path: tools/js-engine-probe/results/measurements.json
          if-no-files-found: error

  core-linux:
    name: Linux 核心可移植性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 运行核心测试
        run: cargo test -p omnitrigger-core --locked

      - name: 检查核心代码
        run: cargo clippy -p omnitrigger-core --all-targets --locked -- -D warnings
