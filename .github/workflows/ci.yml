name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  windows:
    name: Windows 检查与构建
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: 检查、构建并验证示例配置
        shell: pwsh
        run: ./scripts/check.ps1

  core-linux:
    name: Linux 核心可移植性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy

      - name: 运行核心测试
        run: cargo test -p omnitrigger-core --locked

      - name: 检查核心代码
        run: cargo clippy -p omnitrigger-core --all-targets --locked -- -D warnings
