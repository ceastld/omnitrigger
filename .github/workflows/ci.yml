name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  windows:
    name: Windows 检查与构建
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 检查、构建并验证示例配置
        shell: pwsh
        run: ./scripts/check.ps1

      - name: 验证独立窗口站中的剪贴板排除格式
        shell: pwsh
        run: |
          cargo test --locked -p omnitrigger-windows --test clipboard_exclusion -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p omnitrigger-windows --test clipboard_data -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p omnitrigger-app isolated_clipboard_restore_smoke -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证独立窗口站中的历史监听与退出
        shell: pwsh
        run: |
          $historyHelperCandidate = Join-Path $env:GITHUB_WORKSPACE 'target\debug\omnitrigger.exe'
          if (-not (Test-Path -LiteralPath $historyHelperCandidate -PathType Leaf)) {
            throw '缺少已构建并接入内部历史读取入口的自有辅助程序。'
          }
          $historyPreviousHelper = $env:OMNITRIGGER_HISTORY_HELPER_EXE
          try {
            $env:OMNITRIGGER_HISTORY_HELPER_EXE = (Resolve-Path -LiteralPath $historyHelperCandidate).Path
            cargo test --locked -p omnitrigger-windows --test clipboard_history_listener -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:OMNITRIGGER_HISTORY_HELPER_EXE = $historyPreviousHelper
          }

      - name: 验证独立窗口站中的持续历史辅助进程
        shell: pwsh
        run: |
          $historyWorkerExecutable = Join-Path $env:GITHUB_WORKSPACE 'target\debug\omnitrigger.exe'
          if (-not (Test-Path -LiteralPath $historyWorkerExecutable -PathType Leaf)) {
            throw '缺少已构建并接入持续历史入口的自有程序。'
          }
          $historyWorkerPrevious = $env:OMNITRIGGER_HISTORY_HELPER_EXE
          try {
            $env:OMNITRIGGER_HISTORY_HELPER_EXE = (Resolve-Path -LiteralPath $historyWorkerExecutable).Path
            cargo test --locked -p omnitrigger-windows --test clipboard_history_worker -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:OMNITRIGGER_HISTORY_HELPER_EXE = $historyWorkerPrevious
          }

      - name: 验证历史助手在父进程退出后收尾
        shell: pwsh
        run: |
          cargo test --locked -p omnitrigger-windows --test clipboard_history_child_job_os parent_ -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 SDK 检查使用的 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/script-sdk-check/package-lock.json

      - name: 验证脚本工程与真实类型检查
        shell: pwsh
        run: |
          Push-Location tools/script-sdk-check
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          node tools/script-sdk-check/check.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-fs-stat.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-wheel-input-cli.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-single-instance.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 默认仅Node模式，不附加--light-host。
          node tools/script-sdk-check/check-clipboard-history.mjs target/debug/omnitrigger.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustfmt --edition=2024 --check tools/script-sdk-check/file-open-probe.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition=2024 --crate-name omnitrigger_file_open_probe tools/script-sdk-check/file-open-probe.rs -o .tmp/file-open-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-node-open.mjs target/debug/omnitrigger.exe .tmp/file-open-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证 Node 输出采集与断连后的进程收尾
        shell: pwsh
        run: |
          $captureNode = (Get-Command node).Source
          $captureRoot = Join-Path $env:RUNNER_TEMP ("app-node-capture-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $captureRoot -ErrorAction Stop | Out-Null
          $captureFixture = Join-Path $captureRoot 'process-capture-fixture.exe'
          rustc --edition=2024 --crate-name process_capture_fixture tools/script-sdk-check/process-capture-fixture.rs -o $captureFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/check-app-node-capture.mjs --suite normal --app "$PWD/target/debug/omnitrigger.exe" --node $captureNode --fixture $captureFixture --case-root "$captureRoot/cli" --cold-timeout-ms 60000 --case-timeout-ms 20000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $capturePreviousNode = $env:OMNITRIGGER_APP_CAPTURE_NODE
          $capturePreviousFixture = $env:OMNITRIGGER_CAPTURE_FIXTURE
          $capturePreviousRoot = $env:OMNITRIGGER_APP_CAPTURE_CASE_ROOT
          try {
            $env:OMNITRIGGER_APP_CAPTURE_NODE = $captureNode
            $env:OMNITRIGGER_CAPTURE_FIXTURE = $captureFixture
            $env:OMNITRIGGER_APP_CAPTURE_CASE_ROOT = $captureRoot
            cargo test --locked -p omnitrigger-app --bin omnitrigger process_capture_host::node_native::node_self_exit_cleans_capture_job_while_parent_test_process_lives -- --ignored --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked -p omnitrigger-app --bin omnitrigger process_capture_host::node_native::action_service_cancel_cleans_capture_job_while_parent_test_process_lives -- --ignored --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked -p omnitrigger-app --bin omnitrigger process_capture_host::node_native::node_outer_deadline_cleans_capture_job_while_parent_test_process_lives -- --ignored --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:OMNITRIGGER_APP_CAPTURE_NODE = $capturePreviousNode
            $env:OMNITRIGGER_CAPTURE_FIXTURE = $capturePreviousFixture
            $env:OMNITRIGGER_APP_CAPTURE_CASE_ROOT = $capturePreviousRoot
          }

      - name: 验证已有轻量工程的独立类型检查
        shell: pwsh
        run: |
          node --test tools/script-sdk-check/check-project-types.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/script-sdk-check/analyze-script-modules.test.mjs tools/script-sdk-check/analyze-script-entry.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证常用动作和浏览器工作流
        shell: pwsh
        run: |
          node --test tests/browser_workflows.test.mjs tests/browser_default_tab.test.mjs tests/browser_default_tab_sync.test.mjs tests/notification_action_contract.test.mjs examples/actions/common-desktop/recipes.test.mjs examples/actions/common-search/recipes.test.mjs examples/actions/script-choice/contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/script-sdk-check/node_modules/typescript/lib/tsc.js -p examples/actions/browser-workflows/jsconfig.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/ui_notify_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/desktop_api_open_history.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/desktop_api_toggle_history.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/fs_stat_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/node_open_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/clipboard_data_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/clipboard_history_api.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/clipboard_history_cli_metadata.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/actions/clipboard-history/recipes.test.mjs examples/actions/target-window-menu/recipes.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/process_capture_bridge_api.test.mjs tests/process_capture_bridge_transport.test.mjs tests/app_node_capture_check.test.mjs tests/process_capture_api.test.mjs tests/process_capture_contract.test.mjs tests/process_capture_sdk.test.mjs tests/clipboard_history_inspector.test.mjs tests/clipboard_history_inspector_scan_limit.test.mjs examples/actions/json-text/recipes.test.mjs examples/actions/selection-history/recipes.test.mjs examples/actions/process-output/recipes.test.mjs examples/actions/process-output/encoding-boundaries.test.mjs examples/actions/process-output/cross-entry-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/actions/common-search/open-or-search.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/actions/path-text/recipes.test.mjs examples/actions/line-text/recipes.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/actions/process-output/node-capture.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证轻量脚本开发包的真实安装与切换
        shell: pwsh
        run: |
          rustup component add rust-docs --toolchain 1.90.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/js-engine-probe/package-runtime.ps1 -OutputDirectory "$PWD/.tmp/script-runtime-ci"
          node tools/js-engine-probe/check-install.mjs target/debug/omnitrigger.exe .tmp/script-runtime-ci/result.json .tmp/file-open-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证更新服务发布通知
        run: python -m unittest discover -s scripts -p 'test_update_*.py' -v

      - name: 验证离线动作迁移评估
        run: python -m unittest discover -s scripts -p 'test_*migration.py' -v

      - name: 验证动作正文快照工具
        run: python -m unittest discover -s scripts -p 'test_snapshot_action_candidates.py' -v

      - name: 验证鼠标快照配置投影
        run: python -m unittest discover -s scripts -p 'test_mouse_snapshot_projection.py' -v

  js-engines:
    name: Windows JS 引擎实验
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tools/js-engine-probe
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: 安装真实脚本验收使用的 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 缓存实验构建
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/js-engine-probe -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 格式、真实宿主测试与 Clippy
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($engine in @('boa', 'quickjs')) {
            $engineArguments = @('--release', '--locked', '--no-default-features', '--features', $engine)
            if ($engine -eq 'quickjs') { $engineArguments += @('--target-dir', 'target/quickjs') }
            cargo test @engineArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --all-targets @engineArguments -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 构建两种引擎并测量体积
        run: ./measure.ps1

      - name: 验证输出采集的自有夹具与宿主退出收尾
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw '缺少明确的CI临时目录。' }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) { throw '缺少明确的工作区路径。' }
          $captureCaseRoot = Join-Path $env:RUNNER_TEMP ("process-capture-ci-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $captureCaseRoot) { throw '受控目录必须全新创建。' }
          New-Item -ItemType Directory -Path $captureCaseRoot -ErrorAction Stop | Out-Null
          $captureFixtureSource = Join-Path $env:GITHUB_WORKSPACE 'tools\script-sdk-check\process-capture-fixture.rs'
          $captureFixture = Join-Path $captureCaseRoot 'process-capture-fixture.exe'
          rustfmt --edition=2024 --check $captureFixtureSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition=2024 --crate-name process_capture_fixture $captureFixtureSource -o $captureFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $captureFixture -PathType Leaf)) { throw '自有夹具未构建。' }
          $capturePreviousFixture = $env:OMNITRIGGER_CAPTURE_FIXTURE
          $capturePreviousHost = $env:OMNITRIGGER_CAPTURE_HOST
          $capturePreviousRoot = $env:OMNITRIGGER_CAPTURE_CASE_ROOT
          $capturePreviousEngine = $env:OMNITRIGGER_CAPTURE_ENGINE
          try {
            $env:OMNITRIGGER_CAPTURE_FIXTURE = (Resolve-Path -LiteralPath $captureFixture).Path
            $env:OMNITRIGGER_CAPTURE_CASE_ROOT = (Resolve-Path -LiteralPath $captureCaseRoot).Path
            foreach ($engine in @('boa', 'quickjs')) {
              $captureHost = Join-Path $PWD "results/$engine-small.exe"
              if (-not (Test-Path -LiteralPath $captureHost -PathType Leaf)) { throw '缺少测量步骤构建的明确宿主。' }
              $env:OMNITRIGGER_CAPTURE_HOST = (Resolve-Path -LiteralPath $captureHost).Path
              $env:OMNITRIGGER_CAPTURE_ENGINE = $engine
              node ../script-sdk-check/process-capture-test-support.mjs --warmup
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($engine -eq 'boa') {
                $captureTestName = 'process_capture::tests::controlled_fixture_capture_cases'
                $captureTests = & cargo test --manifest-path ../../Cargo.toml -p omnitrigger-windows --release --locked --lib -- --list
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                if (@($captureTests | Where-Object { $_ -eq "$($captureTestName): test" }).Count -ne 1) { throw '未找到唯一受控采集用例。' }
                cargo test --manifest-path ../../Cargo.toml -p omnitrigger-windows --release --locked --lib $captureTestName -- --ignored --exact --test-threads=1
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
              node --test --test-concurrency=1 ../../tests/process_capture_parent_kill.test.mjs ../../tests/process_capture_host.test.mjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            $env:OMNITRIGGER_CAPTURE_FIXTURE = $capturePreviousFixture
            $env:OMNITRIGGER_CAPTURE_HOST = $capturePreviousHost
            $env:OMNITRIGGER_CAPTURE_CASE_ROOT = $capturePreviousRoot
            $env:OMNITRIGGER_CAPTURE_ENGINE = $capturePreviousEngine
          }

      - name: 验证轻量引擎接入动作服务
        run: |
          $env:OMNITRIGGER_TEST_NODE = (Get-Command node).Source
          foreach ($engine in @('boa', 'quickjs')) {
            $env:OMNITRIGGER_TEST_SCRIPT_HOST = Join-Path $PWD "results/$engine-small.exe"
            cargo test --manifest-path ../../Cargo.toml --locked -p omnitrigger-actions --tests -- --ignored --skip _history_ --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 验证显式文本历史的真实 Node 和两种轻量引擎
        run: |
          # NativeHost只提供合成JSON，不读系统剪贴板，不启动监听、界面或发送输入。
          $env:OMNITRIGGER_TEST_NODE = (Get-Command node).Source
          cargo test --manifest-path ../../Cargo.toml --locked -p omnitrigger-actions --test clipboard_history node_history_ -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($engine in @('boa', 'quickjs')) {
            $env:OMNITRIGGER_TEST_SCRIPT_HOST = Join-Path $PWD "results/$engine-small.exe"
            cargo test --manifest-path ../../Cargo.toml --locked -p omnitrigger-actions --test clipboard_history light_history_ -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 保存测量数据
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-engine-measurements
          path: tools/js-engine-probe/results/measurements.json
          if-no-files-found: error

  core-linux:
    name: Linux 核心可移植性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 运行核心测试
        run: cargo test -p omnitrigger-core --locked

      - name: 检查核心代码
        run: cargo clippy -p omnitrigger-core --all-targets --locked -- -D warnings
