[package]
name = "omnitrigger-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OmniTrigger 组合输入与提示消息测试界面"

[[bin]]
name = "omnitrigger"
path = "src/main.rs"

[dependencies]
omnitrigger-core = { path = "../omnitrigger-core" }
omnitrigger-windows = { path = "../omnitrigger-windows" }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "=1.13.3"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "=3.0.12"
