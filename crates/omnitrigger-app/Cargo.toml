[package]
name = "omnitrigger-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
description = "OmniTrigger 组合输入与外部命令执行界面"

[[bin]]
name = "omnitrigger"
path = "src/main.rs"

[dependencies]
omnitrigger-core = { path = "../omnitrigger-core" }
omnitrigger-actions = { path = "../omnitrigger-actions" }
omnitrigger-windows = { path = "../omnitrigger-windows" }
omnitrigger-browser = { git = "https://github.com/ceastld/omnitrigger-browser", rev = "fd2b205a48f2fecc414dc6fb63b3687d586e5ef3" }
tokio = { version = "1", features = ["rt", "net", "time"] }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "=1.13.3"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "=3.0.12"
