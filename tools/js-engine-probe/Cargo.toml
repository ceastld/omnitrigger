[package]
name = "omnitrigger-js-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# 独立实验，不把脚本引擎依赖带进桌面应用及其发行包。
[workspace]
resolver = "2"

[features]
default = ["boa"]
boa = ["dep:boa_engine"]
quickjs = ["dep:rquickjs"]

[dependencies]
boa_engine = { version = "=0.21.1", default-features = false, optional = true }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
omnitrigger-windows = { path = "../../crates/omnitrigger-windows" }

[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
